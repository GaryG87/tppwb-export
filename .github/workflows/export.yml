name: TPPWB Export

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        run: pip install requests beautifulsoup4

      - name: Export ausführen
        env:
          TPPWB_NUM: ${{ secrets.TPPWB_NUM }}
          TPPWB_PIN: ${{ secrets.TPPWB_PIN }}
        run: python tppwb_export.py
        continue-on-error: true

      - name: Sicherstellen, dass eine Datei existiert
        if: always()
        run: |
          mkdir -p export
          if [ ! -f export/results.json ]; then
            echo '{"status":"skript_hat_nichts_geschrieben","zeit":"'"$(date -u +%FT%TZ)"'"}' > export/results.json
          fi

      - name: Ergebnis committen
        if: always()
        run: |
          git config user.name "tppwb-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f export/results.json
          git diff --cached --quiet || git commit -m "Export $(date -u +%FT%H:%M)"
          git pull --rebase --autostash || true
          git push
